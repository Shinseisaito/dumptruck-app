<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>新勢商事 運行管理システム</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#f4f4f4;
  font-family:sans-serif;
  padding-bottom:120px;
}

.header{
  background:#111;
  color:#fff;
  text-align:center;
  padding:20px;
  font-size:24px;
  font-weight:bold;
  border-bottom:5px solid #ff7b00;
}

.container{
  padding:15px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.section-title{
  font-size:20px;
  font-weight:bold;
  color:#ff7b00;
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:5px;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  margin-bottom:15px;
  font-size:16px;
}

textarea{
  min-height:100px;
}

.add-btn{
  width:100%;
  border:none;
  padding:15px;
  border-radius:10px;
  background:#ff7b00;
  color:white;
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.result-box{
  background:#fff3e8;
  padding:15px;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
  color:#ff7b00;
}

.fixed-submit{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  background:white;
  padding:15px;
  box-shadow:0 -2px 10px rgba(0,0,0,.15);
}

.submit-btn{
  width:100%;
  border:none;
  border-radius:12px;
  padding:18px;
  background:#ff7b00;
  color:white;
  font-size:22px;
  font-weight:bold;
}

.check-item{
  margin-bottom:20px;
}

.check-title{
  font-weight:bold;
  margin-bottom:8px;
}

.check-buttons{
  display:flex;
  gap:10px;
}

.check-buttons button{
  flex:1;
  border:none;
  border-radius:10px;
  padding:14px;
  font-size:18px;
  font-weight:bold;
  background:#ddd;
}

.ok.active{
  background:#16a34a;
  color:white;
}

.ng.active{
  background:#dc2626;
  color:white;
}

.na.active{
  background:#6b7280;
  color:white;
}

</style>

</head>

];

// プルダウンに選択肢を詰め込む共通関数
function setupIcOptions(selectElement) {
  selectElement.innerHTML = "";
  hokkaidoICs.forEach(ic => {
    const opt = document.createElement("option");
    opt.value = ic;
    opt.innerText = ic;
    // タイトルのような区切り行は選択できないようにする
    if (ic.startsWith("--")) {
      opt.disabled = true;
      opt.style.fontWeight = "bold";
      opt.style.background = "#eee";
    }
    selectElement.appendChild(opt);
  });
}

// ---------------------
// 走行距離自動計算
// ---------------------

function calcDistance(){

const start =
Number(
document
.getElementById(
"startKm"
).value || 0
);

const end =
Number(
document
.getElementById(
"endKm"
).value || 0
);

document
.getElementById(
"distanceResult"
)
.innerText =
end - start;

}

document
.addEventListener(
"input",
calcDistance
);

</script>

class="card"
id="memoArea"

>

異常報告

id="memo"
></textarea>

<div class="fixed-submit">

<button
class="submit-btn"
id="submitBtn"
onclick="sendData()"
>

送信

<script>

// --------------------
// GAS URL
// --------------------

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwN5y8Eif-a8rq372WHU7i8o4SdQqdVbL2ti4gZgRJGiQE_FEPFn1BtWH4RBsCmiq64Fw/exec";

// --------------------
// 点検項目
// --------------------

const items = [

"タイヤ",
"ホイールナット",
"灯火類",
"油漏れ",
"エア漏れ",
"ホーン",
"バックブザー",
"荷台",
"グリースアップ（キングピン・トラニオン）",
"グリースアップ（週１項目）"

];

let checks = {};

const checksDiv =
document.getElementById("checks");

// --------------------
// 点検生成
// --------------------

items.forEach(item=>{

const div =
document.createElement("div");

div.className =
"check-item";

div.innerHTML = `

<div class="check-title">
${item}
</div>

<div class="check-buttons">

<button
type="button"
class="ok"
>
○
</button>

<button
type="button"
class="ng"
>
×
</button>

<button
type="button"
class="na"
>
該当なし
</button>

</div>

`;

const buttons =
div.querySelectorAll(
"button"
);

buttons[0].onclick =
()=>setCheck(
item,
"OK",
buttons[0]
);

buttons[1].onclick =
()=>setCheck(
item,
"NG",
buttons[1]
);

buttons[2].onclick =
()=>setCheck(
item,
"該当なし",
buttons[2]
);

checksDiv.appendChild(
div
);

});

// --------------------
// 点検状態
// --------------------

function setCheck(
item,
value,
btn
){

checks[item] =
value;

btn.parentElement
.querySelectorAll(
"button"
)
.forEach(b=>{

b.classList.remove(
"active"
);

});

btn.classList.add(
"active"
);

const hasNg =
Object.values(
checks
).includes("NG");

document
.getElementById(
"memoArea"
)
.style.display =
hasNg
?
"block"
:
"none";

if(
item ===
"グリースアップ（週１項目）"
&&
value==="OK"
){

const next =
new Date();

next.setDate(
next.getDate()+7
);

document
.getElementById(
"greaseNext"
)
.value =
next
.toISOString()
.split("T")[0];

}

saveForm();

}

// --------------------
// LocalStorage保存
// --------------------

function saveForm(){

// 動的に追加された現場情報を取得
const sites = [];
document.querySelectorAll(".site-block").forEach(block => {
  sites.push({
    siteName: block.querySelector(".siteName").value,
    unic: block.querySelector(".unic").value,
    loading: block.querySelector(".loading").value,
    unloading: block.querySelector(".unloading").value
  });
});

// 動的に追加されたETC情報を取得
const etcs = [];
document.querySelectorAll(".etc-block").forEach(block => {
  etcs.push({
    type: block.querySelector(".etcType").value,
    start: block.querySelector(".etcStart").value,
    end: block.querySelector(".etcEnd").value,
    count: block.querySelector(".etcCount").value,
    price: block.querySelector(".etcPrice").value
  });
});

// 点呼管理データの一時保存
localStorage.setItem(
"shinseiForm",
JSON.stringify({

driver:
driver.value,

truck:
truck.value,

contractor:
contractor.value,

beforeRollCall: beforeRollCall.value,
beforeMethod: beforeMethod.value,
beforeHealth: beforeHealth.value,
beforeAlcoholCheck: beforeAlcoholCheck.value,
beforeAlcoholResult: beforeAlcoholResult.value,
beforeDetector: beforeDetector.value,

middleRollCall: middleRollCall.value,
middleMethod: middleMethod.value,
middleHealth: middleHealth.value,
middleAlcoholCheck: middleAlcoholCheck.value,
middleAlcoholResult: middleAlcoholResult.value,
middleDetector: middleDetector.value,

afterRollCall: afterRollCall.value,
afterMethod: afterMethod.value,
afterHealth: afterHealth.value,
afterAlcoholCheck: afterAlcoholCheck.value,
afterAlcoholResult: afterAlcoholResult.value,
afterDetector: afterDetector.value,

sites: sites,
etcs: etcs,

startKm:
startKm.value,

endKm:
endKm.value,

fuelKm:
fuelKm.value,

fuelLiter:
fuelLiter.value,

adblueLiter:
adblueLiter.value,

greaseNext: greaseNext.value,

memo:
memo.value,

checks:
checks

})

);

}

// --------------------
// LocalStorage復元
// --------------------

function loadForm(){

const saved =
localStorage.getItem(
"shinseiForm"
);

if(!saved) return;

const data =
JSON.parse(saved);

driver.value =
data.driver || "";

truck.value =
data.truck || "";

contractor.value =
data.contractor || "";

if(data.beforeRollCall) beforeRollCall.value = data.beforeRollCall;
if(data.beforeMethod) beforeMethod.value = data.beforeMethod;
if(data.beforeHealth) beforeHealth.value = data.beforeHealth;
if(data.beforeAlcoholCheck) beforeAlcoholCheck.value = data.beforeAlcoholCheck;
if(data.beforeAlcoholResult) beforeAlcoholResult.value = data.beforeAlcoholResult;
if(data.beforeDetector) beforeDetector.value = data.beforeDetector;

if(data.middleRollCall) middleRollCall.value = data.middleRollCall;
if(data.middleMethod) middleMethod.value = data.middleMethod;
if(data.middleHealth) middleHealth.value = data.middleHealth;
if(data.middleAlcoholCheck) middleAlcoholCheck.value = data.middleAlcoholCheck;
if(data.middleAlcoholResult) middleAlcoholResult.value = data.middleAlcoholResult;
if(data.middleDetector) middleDetector.value = data.middleDetector;

if(data.afterRollCall) afterRollCall.value = data.afterRollCall;
if(data.afterMethod) afterMethod.value = data.afterMethod;
if(data.afterHealth) afterHealth.value = data.afterHealth;
if(data.afterAlcoholCheck) afterAlcoholCheck.value = data.afterAlcoholCheck;
if(data.afterAlcoholResult) afterAlcoholResult.value = data.afterAlcoholResult;
if(data.afterDetector) afterDetector.value = data.afterDetector;

// 現場情報のブロック数調整と復元
if(data.sites && data.sites.length > 0){
  const container = document.getElementById("siteContainer");
  container.innerHTML = "";
  data.sites.forEach((site, index) => {
    if(index === 0){
      container.innerHTML = `
        <div class="site-block">
          <label>現場名</label><input class="siteName">
          <label>ユニック使用</label>
          <select class="unic"><option value=""></option><option>有</option><option>無</option></select>
          <label>積場</label><input class="loading">
          <label>降場</label><input class="unloading">
        </div>`;
    } else {
      addSite();
    }
    const blocks = container.querySelectorAll(".site-block");
    const currentBlock = blocks[blocks.length - 1];
    currentBlock.querySelector(".siteName").value = site.siteName || "";
    currentBlock.querySelector(".unic").value = site.unic || "";
    currentBlock.querySelector(".loading").value = site.loading || "";
    currentBlock.querySelector(".unloading").value = site.unloading || "";
  });
}

// ETC情報のブロック数調整と復元
if(data.etcs && data.etcs.length > 0){
  const container = document.getElementById("etcContainer");
  container.innerHTML = "";
  data.etcs.forEach((etc, index) => {
    if(index === 0){
      container.innerHTML = `
        <div class="etc-block">
          <label>支払区分</label>
          <select class="etcType"><option value=""></option><option>得意先払い</option><option>当社払い</option><option>本人払い</option></select>
          <label>乗り口IC</label><select class="etcStart"></select>
          <label>降り口IC</label><select class="etcEnd"></select>
          <label>高速使用回数</label><input type="number" class="etcCount">
          <label>高速料金(円)</label><input type="number" class="etcPrice">
        </div>`;
      setupIcOptions(container.querySelector(".etcStart"));
      setupIcOptions(container.querySelector(".etcEnd"));
    } else {
      addEtc();
    }
    const blocks = container.querySelectorAll(".etc-block");
    const currentBlock = blocks[blocks.length - 1];
    currentBlock.querySelector(".etcType").value = etc.type || "";
    currentBlock.querySelector(".etcStart").value = etc.start || "";
    currentBlock.querySelector(".etcEnd").value = etc.end || "";
    currentBlock.querySelector(".etcCount").value = etc.count || "";
    currentBlock.querySelector(".etcPrice").value = etc.price || "";
  });
}

startKm.value =
data.startKm || "";

endKm.value =
data.endKm || "";

fuelKm.value =
data.fuelKm || "";

fuelLiter.value =
data.fuelLiter || "";

adblueLiter.value =
data.adblueLiter || "";

greaseNext.value =
data.greaseNext || "";

memo.value =
data.memo || "";

checks =
data.checks || {};

// 日常点検ボタンのアクティブ状態復元
Object.keys(checks).forEach(item => {
  const value = checks[item];
  const titles = document.querySelectorAll(".check-title");
  titles.forEach(t => {
    if(t.innerText.trim() === item){
      const buttons = t.parentElement.querySelectorAll("button");
      buttons.forEach(b => {
        if((b.innerText.trim() === "○" && value === "OK") ||
           (b.innerText.trim() === "×" && value === "NG") ||
           (b.innerText.trim() === "該当なし" && value === "該当なし")){
          b.classList.add("active");
        }
      });
    }
  });
});

const hasNg = Object.values(checks).includes("NG");
document.getElementById("memoArea").style.display = hasNg ? "block" : "none";

calcDistance();

}

// --------------------
// 送信
// --------------------

async function sendData(){

try{

const submitBtn =
document.getElementById(
"submitBtn"
);

submitBtn.disabled =
true;

submitBtn.innerText =
"送信中...";

// 送信時にリアルタイムの現場データを集計
const sites = [];
document.querySelectorAll(".site-block").forEach(block => {
  sites.push({
    siteName: block.querySelector(".siteName").value,
    unic: block.querySelector(".unic").value,
    loading: block.querySelector(".loading").value,
    unloading: block.querySelector(".unloading").value
  });
});

// 送信時にリアルタイムのETCデータを集計
const etcs = [];
document.querySelectorAll(".etc-block").forEach(block => {
  etcs.push({
    type: block.querySelector(".etcType").value,
    start: block.querySelector(".etcStart").value,
    end: block.querySelector(".etcEnd").value,
    count: block.querySelector(".etcCount").value,
    price: block.querySelector(".etcPrice").value
  });
});

const data = {

driver:
driver.value,

truck:
truck.value,

contractor:
contractor.value,

beforeRollCall: beforeRollCall.value,
beforeMethod: beforeMethod.value,
beforeHealth: beforeHealth.value,
beforeAlcohol: beforeAlcoholCheck.value,
beforeAlcoholResult: beforeAlcoholResult.value,
beforeDetector: beforeDetector.value,

middleRollCall: middleRollCall.value,
middleMethod: middleMethod.value,
middleHealth: middleHealth.value,
middleAlcohol: middleAlcoholCheck.value,
middleAlcoholResult: middleAlcoholResult.value,
middleDetector: middleDetector.value,

afterRollCall: afterRollCall.value,
afterMethod: afterMethod.value,
afterHealth: afterHealth.value,
afterAlcohol: afterAlcoholCheck.value,
afterAlcoholResult: afterAlcoholResult.value,
afterDetector: afterDetector.value,

sites: sites,
etcs: etcs,

startKm:
startKm.value,

endKm:
endKm.value,

distance:
Number(
endKm.value||0
)
-
Number(
startKm.value||0
),

fuelKm:
fuelKm.value,

fuelLiter:
fuelLiter.value,

adblueLiter:
adblueLiter.value,

greaseNext: greaseNext.value,

memo:
memo.value,

checks:
checks

};

const response =
await fetch(
SCRIPT_URL,
{
method:"POST",
headers:{
"Content-Type":
"text/plain"
},
body:
JSON.stringify(data)
}
);

const result =
await response.json();

if(
result.status
!==
"success"
){

alert(
"送信失敗\n"+
result.message
);

submitBtn.disabled =
false;

submitBtn.innerText =
"送信";

return;

}

alert(
"送信完了"
);

localStorage.removeItem(
"shinseiForm"
);

location.reload();

}catch(error){

alert(
"通信エラー\n"+
error
);

document
.getElementById(
"submitBtn"
)
.disabled =
false;

document
.getElementById(
"submitBtn"
)
.innerText =
"送信";

}

}

// 入力イベント割り当て関数
function bindInputEvents() {
  document.querySelectorAll("input,textarea,select").forEach(el=>{
    el.removeEventListener("input", handleInputChange);
    el.addEventListener("input", handleInputChange);
  });
}

function handleInputChange() {
  saveForm();
  calcDistance();
}

// --------------------
// 起動
// --------------------

window.onload = ()=>{

// 最初のETC入力欄に北海道ICリストをセット
setupIcOptions(document.querySelector(".etcStart"));
setupIcOptions(document.querySelector(".etcEnd"));

loadForm();
bindInputEvents();

};

</script>
